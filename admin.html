<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex,nofollow">
<title>إدارة منصة أثر - هيئة طموح</title><script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>@media(min-width:1500px){body{zoom:1.15}}@media(min-width:1800px){body{zoom:1.4}}@media(min-width:2100px){body{zoom:1.65}}@media(min-width:2600px){body{zoom:2}}body{font-family:'Tajawal',sans-serif;background:#f8fafc}.inp{width:100%;font-size:13px;padding:12px;border-radius:12px;border:1px solid #e2e8f0}</style></head>
<body class="min-h-screen">
<div id="login" class="min-h-screen flex items-center justify-center p-4"><form onsubmit="go(event)" class="bg-white p-8 rounded-3xl border shadow-md w-full max-w-sm space-y-4"><div class="text-center"><h1 class="text-2xl font-black">إدارة منصة أثر</h1><p class="text-xs text-slate-500">فضاء خاص بهيئة طموح</p></div><input id="tok" type="password" required placeholder="رمز الإدارة (ADMIN_TOKEN)" class="inp"><button class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm">دخول</button><p id="err" class="text-xs text-red-600 hidden text-center">رمز غير صحيح أو تعذر الاتصال.</p></form></div>
<div id="app" class="hidden max-w-[2200px] mx-auto p-4 sm:p-6 space-y-6">
<header class="bg-slate-900 text-white p-6 rounded-2xl flex flex-wrap justify-between items-center gap-3"><div><h1 class="text-2xl font-black">لوحة إدارة هيئة طموح</h1><p class="text-xs text-slate-300">قبول المسجلين والأنشطة وعروض المستثمرين قبل ظهورها للعامة</p></div><button onclick="load()" class="bg-white/10 px-4 py-2 rounded-xl text-xs font-bold">تحديث</button></header>
<div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
<div class="flex flex-wrap gap-2" id="tabs"></div>
<div class="flex gap-2 text-xs"><select id="flt" onchange="draw()" class="inp !w-auto"><option>الكل</option><option>قيد الدراسة</option><option>مقبول</option><option>مرفوض</option></select><input id="q" oninput="draw()" placeholder="بحث..." class="inp"></div>
<div id="list" class="space-y-2"></div></div>
<script>
const URL_="https://script.google.com/macros/s/AKfycbzOOSlFCX4pk_bVQYTxTmpKKpYUSuaU2DnPp7Znc-HSryoAUJuaUboOQgfWZy0e0NlP/exec";
let T="",D={users:[],activities:[],offers:[]},tab="users";const $=i=>document.getElementById(i);
const TB={users:"المسجلون",activities:"الأنشطة",offers:"عروض المستثمرين"};
async function go(e){e.preventDefault();T=$('tok').value.trim();try{await load(true)}catch(x){$('err').classList.remove('hidden')}}
async function load(first){const r=await fetch(URL_+"?action=admin&token="+encodeURIComponent(T)),d=await r.json();if(d.error)throw 0;D=d;if(first){$('login').classList.add('hidden');$('app').classList.remove('hidden')}draw()}
function draw(){const st=x=>x.filter(o=>o.status==='قيد الدراسة').length;$('stats').innerHTML=Object.keys(TB).map(k=>`<div class="bg-white border rounded-2xl p-4"><p class="text-2xl font-black">${D[k].length}</p><p class="text-xs text-slate-500">${TB[k]} • <b class="text-amber-600">${st(D[k])}</b> قيد الدراسة</p></div>`).join('')+`<div class="bg-white border rounded-2xl p-4"><p class="text-2xl font-black">${D.users.filter(u=>u.role==='متطوع').length}</p><p class="text-xs text-slate-500">متطوع</p></div>`;
$('tabs').innerHTML=Object.keys(TB).map(k=>`<button onclick="tab='${k}';draw()" class="px-4 py-2 rounded-xl text-xs font-bold ${tab===k?'bg-emerald-600 text-white':'bg-white border'}">${TB[k]}</button>`).join('');
const f=$('flt').value,q=$('q').value.toLowerCase(),lbl={users:u=>`${u.name} — ${u.role}${u.orgName?' ('+u.orgType+': '+u.orgName+')':''} • ${u.wilaya||''} • ${u.email}${u.level?' • '+u.level+' '+(u.specialty||''):''}${u.skills?' • مهارات: '+u.skills:''}`,activities:a=>`${a.title} — ${a.organizer} • ${a.wilaya} • ${a.category} / ${a.nature}`,offers:o=>`${o.company} — ${o.budget} • ${o.wilayas}`};
const L=D[tab].filter(o=>(f==='الكل'||o.status===f)&&JSON.stringify(o).toLowerCase().includes(q));
$('list').innerHTML=L.map(o=>`<div class="bg-white border rounded-xl p-4 flex flex-wrap justify-between gap-3 items-center"><div class="text-xs space-y-1 flex-1 min-w-[260px]"><p class="font-bold text-sm">${lbl[tab](o)}</p><p class="text-slate-500">${o.description||''}</p><span class="inline-block px-2 py-0.5 rounded-full ${o.status==='مقبول'?'bg-emerald-100 text-emerald-800':o.status==='مرفوض'?'bg-red-100 text-red-700':'bg-amber-100 text-amber-800'}">${o.status}</span> ${o.docUrl?`<a href="${o.docUrl}" target="_blank" class="text-blue-600 underline mr-2">وثيقة الإثبات</a>`:''}${o.techUrl?`<a href="${o.techUrl}" target="_blank" class="text-blue-600 underline mr-2">البطاقة التقنية</a>`:''}${o.logoUrl?`<a href="${o.logoUrl}" target="_blank" class="text-blue-600 underline mr-2">صورة المؤسسة</a>`:''}</div><div class="flex gap-2"><button onclick="setS('${o.id}','مقبول')" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold">قبول</button><button onclick="setS('${o.id}','مرفوض')" class="bg-red-100 text-red-700 px-4 py-2 rounded-lg text-xs font-bold">رفض</button></div></div>`).join('')||'<p class="text-sm text-slate-500">لا توجد عناصر.</p>'}
async function setS(id,st){await fetch(URL_,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"set_status",token:T,table:tab,id,status:st})});setTimeout(load,1500)}
</script></body></html>
